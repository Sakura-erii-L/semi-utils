[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-utils-qt-gui"
version = "0.1.0"
description = "Qt GUI for semi-utils image processing workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.3.0",
  "pyyaml>=6.0.1",
  "python-dateutil>=2.8.2",
  "requests>=2.31.0",
  "PySide6>=6.8.1",
  "exifread>=3.0.0",
  "tqdm>=4.66.0"
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0"
]

[project.scripts]
semi-utils-qt-gui = "main_gui:main"

[tool.setuptools]
py-modules = ["main_gui", "semi_bridge", "gen_video", "init", "utils"]
include-package-data = true

# Runtime assets such as config.yaml, fonts/, logos/, exiftool/, and logo.ico
# are intentionally kept beside the source tree or PyInstaller portable output.
# The editable install entry point is supported; wheel packaging these assets
# would require converting the project to a package-based resource layout.

[tool.setuptools.packages.find]
where = ["."]
include = ["entity", "entity.*", "enums", "enums.*"]

